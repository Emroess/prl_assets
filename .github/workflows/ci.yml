name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras --dev

      # asset_manager is a sibling package, not a prl_assets dependency; without it the
      # registry tests skip. Pinned to the v0.2.0 commit.
      - name: Install asset_manager for the registry tests
        run: uv pip install "asset-manager @ git+https://github.com/personalrobotics/asset_manager.git@f421eb375fe76a0d9c69dcf0dd08ef48d718a969"

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Pytest
        run: |
          if [ -d tests ]; then
            uv run pytest tests/ -v
          else
            echo "No tests/ directory; skipping pytest."
          fi

  ycbv-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      # The pinned BOP archive (525 MB); the audit verifies its SHA-256 before use.
      - name: Cache the BOP YCB-V models
        uses: actions/cache@v4
        with:
          path: ~/.cache/prl_assets
          key: bop-ycbv-models-1e517a9b513cadb8eaf406ac3ce3c5f1d6fc4a80161c866b4e2a73d13de5e554

      - name: YCB-V frames agree with the BOP models
        run: uv run python scripts/audit_ycbv.py --out artifacts/ycbv_audit.json

      - name: Keep the audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ycbv-audit
          path: artifacts/ycbv_audit.json

  notify-robot-code:
    needs: [test, ycbv-audit]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch integration run
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.ROBOT_CODE_DISPATCH_TOKEN }}
          repository: personalrobotics/robot-code
          event-type: sibling-updated
          client-payload: '{"repo":"${{ github.event.repository.name }}","sha":"${{ github.sha }}"}'
